name: Build server image

on:
  push:
    branches: [main, "dev/**"]
    paths: ["server/**", "frontend/**", "phenikaa_exporter.py", "phenikaa_login.py", "pyproject.toml", "package.json", "package-lock.json", "tailwind.config.js", "Dockerfile", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    branches: [main, "dev/**"]
    paths: ["server/**", "frontend/**", "phenikaa_exporter.py", "phenikaa_login.py", "pyproject.toml", "package.json", "package-lock.json", "tailwind.config.js", "Dockerfile", ".dockerignore", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: b4iterdev/phenikaa-calendar-exporter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm ci
          npm run build
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out cluster configuration
        uses: actions/checkout@v4
        with:
          repository: b4iterdev/cluster-config
          ref: main
          token: ${{ secrets.CLUSTER_CONFIG_TOKEN }}
      - name: Update production image digest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid image digest\n' >&2
            exit 1
          fi
          manifest=clusters/production/pca/deployment.json
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          jq -e '
            .kind == "Deployment" and
            .metadata.name == "phenikaa-server" and
            .metadata.namespace == "pca" and
            ([.spec.template.spec.containers[] | select(.name == "server")] | length == 1)
          ' "$manifest" > /dev/null
          jq --arg image "$image" '
            (.spec.template.spec.containers[] | select(.name == "server") | .image) = $image
          ' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          git add "$manifest"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Deploy Phenikaa image ${IMAGE_DIGEST}"
          git push origin HEAD:main
