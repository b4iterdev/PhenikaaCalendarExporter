[project]
name = "phenikaa-calendar-exporter"
version = "1.0.0"
description = "Export an authenticated Phenikaa learning calendar to XLSX, ICS, and JSON"
requires-python = ">=3.9"
dependencies = ["openpyxl==3.1.5"]

[project.optional-dependencies]
login = ["playwright>=1.40"]
server = ["cryptography>=41", "PyJWT[crypto]>=2.8", "playwright>=1.40"]

[project.scripts]
phenikaa-calendar = "phenikaa_exporter:main"
phenikaa-calendar-server = "server.__main__:main"

[tool.setuptools]
py-modules = ["phenikaa_exporter", "phenikaa_login"]
packages = ["server"]
