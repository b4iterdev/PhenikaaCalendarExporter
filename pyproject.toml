[project]
name = "phenikaa-calendar-exporter"
version = "1.0.0"
description = "Export an authenticated Phenikaa learning calendar to XLSX, ICS, and JSON"
requires-python = ">=3.9"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
phenikaa-calendar = "phenikaa_exporter:main"

[tool.setuptools]
py-modules = ["phenikaa_exporter"]
