[package]
name = "phenikaa-cli"
version = "1.0.0"
edition = "2021"
description = "Command-line tool to export Phenikaa student calendar to ICS, XLSX, and JSON"

[dependencies]
phenikaa-core = { path = "../phenikaa-core" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
chrono = { version = "0.4" }
